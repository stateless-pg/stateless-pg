---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  annotations:
    controller-gen.kubebuilder.io/version: v0.19.0
  name: tenantshards.core.stateless-pg.io
spec:
  group: core.stateless-pg.io
  names:
    categories:
    - stateless-pg
    kind: TenantShard
    listKind: TenantShardList
    plural: tenantshards
    shortNames:
    - ts
    singular: tenantshard
  scope: Namespaced
  versions:
  - additionalPrinterColumns:
    - jsonPath: .spec.tenantRef.name
      name: Tenant
      type: string
    - jsonPath: .spec.shardIndex
      name: Shard
      type: string
    - jsonPath: .status.assignedPageserver
      name: Pageserver
      type: string
    - jsonPath: .status.phase
      name: Phase
      type: string
    - jsonPath: .status.conditions[?(@.type == 'Available')].status
      name: Available
      type: string
    - jsonPath: .metadata.creationTimestamp
      name: Age
      type: date
    name: v1alpha1
    schema:
      openAPIV3Schema:
        description: TenantShard is the Schema for the tenantshards API
        properties:
          apiVersion:
            description: |-
              APIVersion defines the versioned schema of this representation of an object.
              Servers should convert recognized schemas to the latest internal value, and
              may reject unrecognized values.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#resources
            type: string
          kind:
            description: |-
              Kind is a string value representing the REST resource this object represents.
              Servers may infer this from the endpoint the client submits requests to.
              Cannot be updated.
              In CamelCase.
              More info: https://git.k8s.io/community/contributors/devel/sig-architecture/api-conventions.md#types-kinds
            type: string
          metadata:
            type: object
          spec:
            description: spec defines the desired state of TenantShard
            properties:
              config:
                description: |-
                  config is the tenant configuration passed through opaquely to the pageserver
                  This configuration is identical for all shards in a tenant
                properties:
                  basebackupCacheEnabled:
                    default: false
                    description: basebackupCacheEnabled enables basebackup caching
                    type: boolean
                  checkpointDistance:
                    default: 268435456
                    description: |-
                      checkpointDistance defines the size threshold between checkpoints (L0 layer file size)
                      Default: 268435456 (256 MB)
                    format: int64
                    minimum: 0
                    type: integer
                  checkpointTimeout:
                    default: 10m
                    description: |-
                      checkpointTimeout defines the maximum time between checkpoints
                      Default: 10 minutes
                    type: string
                  compactionAlgorithm:
                    default: Legacy
                    description: compactionAlgorithm defines the algorithm to use
                      for layer compaction
                    type: string
                  compactionL0First:
                    default: true
                    description: compactionL0First enables L0 compaction pass for
                      responsiveness
                    type: boolean
                  compactionL0Semaphore:
                    default: true
                    description: compactionL0Semaphore enables L0 compaction semaphore
                      for concurrency control
                    type: boolean
                  compactionPeriod:
                    default: 20s
                    description: |-
                      compactionPeriod defines how often to run compaction
                      Default: 20 seconds
                    type: string
                  compactionShardAncestor:
                    default: true
                    description: compactionShardAncestor enables shard-aware compaction
                    type: boolean
                  compactionTargetSize:
                    default: 134217728
                    description: |-
                      compactionTargetSize defines the target layer size for image/delta layers (L1 layer file size)
