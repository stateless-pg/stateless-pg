                  - Attached(1): HA with failover
                  - Attached(2): HA with multiple replicas
                  - Secondary: Onboarding/migration standby
                  - Detached: Archived/idle data
                enum:
                - Attached(0)
                - Attached(1)
                - Attached(2)
                - Secondary
                - Detached
